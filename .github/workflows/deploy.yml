name: Trigger Cloudflare Build

on:
  push:
    branches:
      - main  # Make sure this matches your default branch name (e.g. main or master)

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook to Cloudflare Pages
        run: |
          curl -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
